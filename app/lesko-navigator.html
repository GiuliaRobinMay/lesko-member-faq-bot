<title>Lesko Help Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap">
<style>
/* Light only — deliberate single-theme design. */
:root{
  --yellow:#fdc830; --yellow-warm:#ffb300; --red:#e63946; --red-deep:#c62d3a;
  --blue:#2c3fa0; --blue-deep:#1e2c7a; --green:#4fa84f; --green-deep:#357a35;
  --paper:#faf6ec; --cream:#f4ecd4; --surface:#fffdf7; --panel:#fffdf7;
  --ink:#0e1a2b; --ink-soft:#2a3548; --ink-mid:#586577;
  --line:#d8d0bc; --line-soft:#e6dfca; --accent:var(--blue);
  --sans:Karla,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:Fraunces,Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  height:100%;overflow:hidden;display:flex;flex-direction:column}

/* ---- header (compact) ---- */
header.bar{background:var(--blue);color:#fff;padding:7px 13px;display:flex;align-items:center;gap:9px;
  flex:none;position:sticky;top:0;z-index:5}
.mark{width:32px;height:32px;border-radius:8px;overflow:hidden;flex:none;background:var(--yellow)}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand small{display:block;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;opacity:.8;font-weight:600;line-height:1.3}
.brand strong{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.15}
.burger{margin-left:auto;display:none;flex-direction:column;gap:4px;background:rgba(255,255,255,.14);
  border:0;border-radius:8px;width:36px;height:32px;cursor:pointer;align-items:center;justify-content:center}
.burger span{display:block;width:16px;height:2px;background:#fff;border-radius:2px}
.burger:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* ---- shell ---- */
.shell{flex:1;min-height:0;width:100%;max-width:1120px;margin:0 auto;padding:10px 12px;display:grid;
  grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:stretch;overflow:hidden}
.chat{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.thread{display:grid;gap:11px;flex:1;min-height:0;overflow-y:auto;padding-right:4px;scrollbar-width:thin}
.thread::-webkit-scrollbar{width:8px}
.thread::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---- messages (tightened ~25%) ---- */
.msg{display:flex;gap:9px;align-items:flex-start}
.msg .who{width:30px;height:30px;border-radius:8px;flex:none;overflow:hidden;background:var(--yellow);
  display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--blue-deep)}
.msg .who img{width:100%;height:100%;object-fit:cover;display:block}
.me{flex-direction:row-reverse}
.me .who{background:var(--cream);color:var(--ink-mid)}
.me .who .me-ico{font-size:15px;line-height:1}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;max-width:680px}
.me .bubble{background:var(--cream);border-color:var(--line-soft);font-weight:600;padding:9px 13px}
.bubble h3{font-family:var(--display);font-weight:600;color:var(--accent);font-size:1.08rem;margin:0 0 8px;line-height:1.2}
.bubble h4{font-size:14px;font-weight:700;margin:13px 0 5px}
.bubble h4:first-of-type{margin-top:0}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}
.bubble .lead{color:var(--ink-soft)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 4px;display:grid;gap:6px}
.steps li{counter-increment:s;padding-left:24px;position:relative}
.steps li::before{content:counter(s) ".";position:absolute;left:0;top:0;color:var(--red);font-weight:700}
.bul{list-style:none;padding:0;margin:0 0 4px;display:grid;gap:6px}
.bul li{padding-left:20px;position:relative}
.bul li::before{content:"\2714";position:absolute;left:0;top:0;color:var(--green-deep);font-weight:700}
.tw{overflow-x:auto;margin:3px 0 7px}
table.k{width:100%;border-collapse:collapse;font-size:14px;min-width:320px}
table.k th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mid);
  background:var(--cream);padding:7px 9px;border-bottom:1px solid var(--line)}
table.k td{padding:8px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.k tr:last-child td{border-bottom:0}
table.k a{color:var(--accent);font-weight:600}
.call{border-left:3px solid var(--red);background:rgba(230,57,70,.08);padding:9px 12px;
  border-radius:0 7px 7px 0;margin:4px 0 8px;font-size:14.5px}
.call.key{border-color:var(--accent);background:rgba(44,63,160,.08)}
.btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.btns a{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;text-decoration:none;
  padding:8px 13px;border-radius:8px;border:2px solid transparent}
.btns a.primary{background:var(--red);color:#fff}
.btns a.primary:hover{background:var(--red-deep)}
.btns a.solid{background:var(--yellow);color:#2a2100}
.btns a.solid:hover{background:var(--yellow-warm)}
.btns a.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btns a.ghost:hover{border-color:var(--accent);background:var(--cream)}
.btns a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.src{margin:10px 0 0;font-size:11.5px;color:var(--ink-mid);font-weight:600}
.rel{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft)}
.rel h5{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mid);margin:0 0 6px;font-weight:700}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.rel button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--cream);
  border:1px solid var(--line-soft);border-radius:999px;padding:6px 11px;cursor:pointer}
.rel button:hover{background:var(--yellow);border-color:var(--yellow-warm)}
.rel button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fb{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fb span{font-size:12px;color:var(--ink-mid);font-weight:600}
.fb button{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--cream);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.fb button:hover{background:var(--yellow);border-color:var(--yellow-warm)}
.bubble.dots{display:flex;gap:5px;align-items:center;padding:15px 16px}
.bubble.dots span{width:7px;height:7px;border-radius:50%;background:var(--ink-mid);opacity:.45;
  animation:blink 1.2s infinite ease-in-out}
.bubble.dots span:nth-child(2){animation-delay:.18s}
.bubble.dots span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.bubble.dots span{animation:none;opacity:.5}}

/* ---- composer: always visible ---- */
.composer{margin-top:10px;flex:none;padding-top:9px;border-top:1px solid var(--line-soft)}
.cwrap{display:flex;gap:8px}
.cwrap input{flex:1;font:inherit;font-size:15px;padding:11px 14px;border-radius:9px;border:2px solid var(--line);
  background:var(--surface);color:var(--ink);min-width:0}
.cwrap input:focus{outline:none;border-color:var(--accent)}
.cwrap button{font:inherit;font-size:15px;font-weight:700;padding:11px 20px;border:0;border-radius:9px;
  background:var(--red);color:#fff;cursor:pointer;flex:none}
.cwrap button:hover{background:var(--red-deep)}
.cwrap button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---- sidebar ---- */
aside{background:var(--panel);border:1px solid var(--line);border-radius:11px;border-top:4px solid var(--yellow);
  padding:14px 13px;min-height:0;overflow-y:auto;scrollbar-width:thin}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
aside .eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700;margin:0 0 5px}
aside h2{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.2;margin:0 0 6px}
aside p.intro{margin:0 0 11px;font-size:13px;color:var(--ink-mid);line-height:1.45}
.cats{display:grid;gap:5px}
.cat{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.cat>button{width:100%;text-align:left;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);
  background:transparent;border:0;padding:9px 10px;cursor:pointer;display:flex;align-items:center;gap:8px}
.cat>button:hover{background:var(--cream)}
.cat>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cat .dot{width:8px;height:8px;border-radius:50%;flex:none}
.cat .arrow{margin-left:auto;font-size:10px;color:var(--ink-mid);transition:transform .18s}
.cat[open-state="1"] .arrow{transform:rotate(90deg)}
.cat ul{list-style:none;margin:0;padding:0 7px 7px;display:none;flex-direction:column;gap:1px}
.cat[open-state="1"] ul{display:flex}
.cat ul button{width:100%;text-align:left;font:inherit;font-size:12.5px;color:var(--ink-soft);background:transparent;
  border:0;border-radius:6px;padding:7px 9px;cursor:pointer;line-height:1.3}
.cat ul button:hover{background:var(--cream);color:var(--ink)}
aside .foot{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-mid)}
aside .foot a{color:var(--accent);font-weight:600}
@media(prefers-reduced-motion:reduce){.cat .arrow{transition:none}}

/* ---- narrow: sidebar becomes a drawer behind the burger ---- */
.scrim{display:none;position:fixed;inset:0;background:rgba(14,26,43,.42);z-index:9}
@media(max-width:820px){
  .burger{display:flex}
  .shell{grid-template-columns:1fr}
  aside{position:fixed;top:0;right:0;bottom:0;width:min(300px,86vw);z-index:10;border-radius:0;
    border-top:0;border-left:4px solid var(--yellow);transform:translateX(102%);
    transition:transform .22s ease;box-shadow:-8px 0 26px rgba(14,26,43,.16);padding-top:16px}
  body.nav-open aside{transform:translateX(0)}
  body.nav-open .scrim{display:block}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
/* short frames: trim further */
@media(max-height:460px){
  header.bar{padding:5px 11px}
  .mark{width:24px;height:24px}
  .brand strong{font-size:14px}
  .brand small{display:none}
  .shell{padding:8px 10px}
}
</style>

window.LESKO={"topics": [{"id": "cancel_subscription", "rank": 1, "title": "How do I cancel my subscription or membership?", "audience": "both", "short": "There are two ways: cancel it yourself on the Lesko Support site, or email Customer Service and they will do it for you and confirm by reply.", "steps": ["Cancel inside Mighty Networks — that's it. We pick it up and cancel your subscription wherever you signed up. It's automatic.", "Prefer to do it at the source? Credit card → leskohelp.recurly.com · PayPal → Settings ▸ Payments ▸ Manage Automatic Payments · ClickBank (CLKBANK*/CBKT* on your statement) → clkbank.com order lookup.", "Last resort: email leskohelp@gmail.com with your signup email, plus the date and amount charged.", "On the $1 trial: it runs 5 days, then $19.95/month on day 6 unless you cancel."], "asked": ["How do I cancel my subscription?", "Where is the link to cancel before the 5-day window?", "I'm changing banks, how do I cancel my paid membership?", "Cancel membership", "It is next to impossible to cancel this subscription"], "important": "", "variant": ["Go to https://leskosupport.com/account-management and scroll to the bottom for the cancellation instructions.", "Or email LeskoHelp@gmail.com asking to cancel. Mary Pacey in Customer Service will reply to confirm.", "Include the email address on the account — that's what they need to find you.", "On the $1 / 5-day trial: cancel before day 5 to avoid the next charge."], "status": "verified"}, {"id": "refunds_billing", "rank": 2, "title": "Refunds, unexpected charges and updating my card", "audience": "both", "short": "All billing — refunds, duplicate or unexpected charges, and payment method changes — is handled by Mary Pacey in Customer Service at LeskoHelp@gmail.com. Account details can also be managed on the Lesko Support site.", "steps": ["Email LeskoHelp@gmail.com with your account email and the charge date and amount.", "For an auto-renewal you did not expect, ask to cancel the membership AND refund the auto-renewal in the same message.", "To update a card or check what plan you are on, use https://leskosupport.com/account-management.", "If your profile says 'Free Member' but you are still being charged, say so explicitly — that mismatch needs Customer Service to look at the billing record."], "asked": ["How do I get a refund?", "My account auto renewed. How can I request a refund?", "I'm being charged a monthly subscription yet the site says my membership is free", "How do I update my payment card on file?", "What is the $60 charge?"], "important": "", "variant": null, "status": "verified"}, {"id": "calls_zoom_replays", "rank": 3, "title": "Live calls — what's on, how to join, and where the replays are", "audience": "inside", "short": "There is a live session almost every day. Open the event in the community, click the pink \"Zoom Meeting\" link, and if you don't have Zoom installed click \"Join Zoom from Browser\". Replays go into the Class Replays space.", "steps": ["Open the event post in the community, then click 'Zoom Meeting' written in pink.", "No Zoom account? Click 'Join Zoom from Browser' instead — you do not need to install anything.", "If you can't be heard or seen: hover over the bottom of the Zoom window, click 'Join Audio', then the video button, and allow Zoom to use your microphone and camera.", "'Waiting for the host' means the host has not opened the room yet — stay in the waiting room, it will start.", "Missed it? Find the recording in Class Replays: https://lesko-help-2.mn.co/spaces/24487516", "Struggling during a session — type the problem into the Zoom chat, a coach will help you there."], "asked": ["How do I join zoom?", "Is there a zoom meeting today?", "Where can I find the meeting ID or the invitation link?", "Did I miss the workshop? How can I replay a video?", "Zoom says we are waiting on the host"], "important": "", "variant": null, "status": "verified"}, {"id": "call_sheet_and_reports", "rank": 4, "title": "Call Sheets, Personal Reports and books I paid for", "audience": "inside", "short": "The current deliverable is the Personalized Call Sheet, and there are three ways to get one: a Call Sheet Class, the Lesko AI Researcher, or by asking in the Questions Channel.", "steps": ["Fastest: run the AI Grant Researcher yourself — pick your topic, enter your city and state or ZIP, and it builds your list.", "Or attend a Call Sheet Class and the host will build one with you live.", "Or post what you need in the Questions Channel and the team will reply with a Call Sheet under your post.", "Delivered Call Sheets are posted for you in Personalized Class Answers — check your notification bell.", "Paid book or e-book that hasn't arrived: that's a fulfilment question — email LeskoHelp@gmail.com."], "asked": ["How and who do I ask to start my personal report?", "Can you please update my comprehensive personal report?", "Where is my report?", "I bought the E Book for Texas and I do not see an email with it", "I paid an additional fee to receive a book. When will I receive it?"], "important": "", "variant": null, "status": "needs_check"}, {"id": "navigation", "rank": 5, "title": "I can't find my way around the site", "audience": "inside", "short": "Three places cover almost everything: Explore the Roadmap for the step-by-step path, the Quick Guide Library for your specific need, and the Questions Channel when you're stuck.", "steps": ["Start at Explore the Roadmap — it is the guided path through the community: https://lesko-help-2.mn.co/spaces/24365840", "Then use the Quick Guide Library — one space per need (bills, housing, healthcare, business, cars, legal, veterans, seniors): https://lesko-help-2.mn.co/collections/2517908", "Still stuck? Post in the Questions Channel and the team replies under your post.", "Replies to your posts arrive in your notification bell — that's where to look for answers.", "Prefer to be walked through it live? Monday's OPEN OFFICE with Tony is specifically about learning to navigate Lesko Help."], "asked": ["I am having trouble navigating lesko help 2, can someone help me", "I still don't know how to navigate through this place", "I'm really getting lost trying to figure out how to navigate on this site", "Where are the answers to my questions that I have been posting?"], "important": "", "variant": null, "status": "verified"}, {"id": "getting_started", "rank": 6, "title": "I just joined — what do I do first?", "audience": "inside", "short": "Start with Explore the Roadmap and its checklist, join a Welcome Tour (runs daily), then tell us in the Questions Channel what you actually need help with so we can point you at the right resources.", "steps": ["Work through Explore the Roadmap and complete the setup checklist — even long-time members are asked to do this.", "Join the WELCOME TOUR — it runs every day and walks you around the community.", "Post in the Questions Channel saying what kind of help you're looking for. The team replies under your post with specific recommendations.", "Next step after that is building your Call Sheet — via a Call Sheet Class, the AI Researcher, or the Questions Channel.", "Then move into the Call and Application Classes, and keep using Q&As, Group Coaching and Matthew's Live sessions."], "asked": ["May I please have help getting started", "I'm new to the platform and I'm a bit overwhelmed", "I am 88 and need assistance getting started", "I need a tutorial how to use this site"], "important": "", "variant": null, "status": "verified"}, {"id": "human_support", "rank": 7, "title": "Can I talk to a real person?", "audience": "both", "short": "Yes — live, on Zoom. There is no support phone line. Member Q&As run six days a week, and the Thursday Drop-In Clinic is open all day with no appointment. Billing questions go to email.", "steps": ["To speak to the team live, join any Member Q&A — they run six days a week.", "Thursday Drop-In Clinic: 10:00–18:00 ET, hop in any time, no appointment needed.", "For anything about money — billing, refunds, cancelling — email LeskoHelp@gmail.com (Mary Pacey, Customer Service).", "For grant help, post in the Questions Channel — the team answers in the comments under your post."], "asked": ["Customer Service number?", "How do I contact support please?", "Is there any way to get some 1 on 1 assistance?", "Can someone call me?"], "important": "", "variant": ["Email LeskoHelp@gmail.com — Mary Pacey in Customer Service handles billing, refunds, cancellations and account access.", "Include the email address you signed up with, and the date and amount of any charge you're asking about.", "There is no member support phone line.", "Live Q&As and the Thursday Drop-In Clinic are inside the community — you'll need access restored first."], "status": "verified"}, {"id": "ai_grant_researcher", "rank": 8, "title": "How do I use the AI Grant Researcher?", "audience": "inside", "short": "Pick your topic, enter your city and state or ZIP, and hit Run Research Tool. Results build up over several minutes, then you can open each one for contact details or export the whole list.", "steps": ["Open the AI Grant Researcher: https://lesko-help-2.mn.co/spaces/24461105", "Select your Topic, then enter your ZIP code or your city and state.", "Hit 'Run Research Tool'. Results arrive one or two at a time and a full search can take 10–15 minutes depending on your device and connection.", "Click '2: Results' to see what it found in your area.", "Hit 'See Details' on any organisation for phone numbers, email addresses, eligibility, funding amounts, and a ready-made outreach message.", "Click '3: Export' to download the list to your device as Excel or PDF.", "Click 'Clear Report' to run a fresh search for another topic or area.", "Want to be taught it live? The AI Workshop runs Fridays, and AI User Skills with Roger runs Wednesdays."], "asked": ["Does the members AI tool work, I keep getting page not available", "Your AI doesn't work, I've been trying for a month", "Where do I find the AI tool?", "Where did my AI research results go?"], "important": "", "variant": null, "status": "verified"}, {"id": "login_password", "rank": 9, "title": "I can't log in or I forgot my password", "audience": "both", "short": "Use \"Forgot password?\" on the login page — it resets by email, so you don't need your old password. If that doesn't arrive, the platform's own support team can fix it directly.", "steps": ["On the login page click 'Forgot password?' and follow the email link.", "Check spam/junk if the reset email doesn't appear.", "Still stuck: click the 'Need Help?' button at the bottom of any page in the community.", "'No account found' usually means a different email than the one you joined with — try any other addresses you use.", "Still stuck? Email LeskoHelp@gmail.com with the email address you signed up with and we will sort it out."], "asked": ["I can't get in. My email and password not working", "I didn't receive email to reset my password", "Trying to change password but do not know the current password", "It says no account found with that email"], "important": "", "variant": ["Go to the community directly: https://lesko-help-2.mn.co — don't rely on an old link from an email, several of those now land on dead pages.", "On the login screen click 'Forgot password?' and follow the emailed link. You do not need your old password.", "No reset email? Check spam, then try any other email addresses you might have signed up with — 'no account found' almost always means a different address.", "Account, billing and cancellation are on a different site: https://leskosupport.com/account-management"], "status": "verified"}, {"id": "app_and_devices", "rank": 10, "title": "Which app is it and how do I install it?", "audience": "both", "short": "The app is Mighty Networks, not a \"Lesko\" app — which is why searching the store for Lesko finds nothing. Get it via the QR code in your Personal Settings.", "steps": ["Click your profile picture in the top right, then 'Personal Settings'.", "Scroll down and click 'Download the app' — a QR code appears.", "Scan the QR code, then use the button for Google Play or the App Store depending on your device.", "Log in on your phone with the same email address and password you use on the computer.", "Searching the store for 'Lesko' will not find it — the app is called Mighty Networks."], "asked": ["How do I download the app?", "What is the name of the app that I need to download", "I can't find the Lesko app on Google Play", "Can I have the app on my laptop?"], "important": "", "variant": ["The app is called Mighty Networks. Searching your app store for 'Lesko' will not find it.", "Install Mighty Networks from Google Play or the App Store, then log in with the email and password you used to join.", "Once you're in, you can also get a QR code under your profile picture → Personal Settings → Download the app."], "status": "verified"}, {"id": "broken_links_errors", "rank": 11, "title": "A link, video or page isn't working", "audience": "inside", "short": "Post it in the Questions Channel with the page you were on and what you clicked — the team tests it and replies. Several reported breakages have turned out to be a renamed space.", "steps": ["Post in the Questions Channel: the link or page name, what you clicked, and what you saw.", "Say which device and browser you're on — it helps the team reproduce it.", "Try it once on a different device or browser first if you can — that tells the team whether it's the page or the device.", "Check your browser is up to date. An old browser is a common cause of video that will not play and pages that load half-finished — a current Chrome, Safari, Edge or Firefox is what the site expects.", "Note: some 'broken' links are spaces that were renamed in the 2026 roadmap rebuild — for example 'Welcome and Set Up' is now 'Explore the Roadmap'."], "asked": ["Nothing happens when I select the prompt", "The link doesn't work", "Trying to watch videos but it keeps saying error will not play video", "Lesko500.com appears to be down"], "important": "", "variant": null, "status": "needs_check"}, {"id": "profile_account", "rank": 12, "title": "Changing my name, email or profile details", "audience": "inside", "short": "Profile picture → Personal Settings → edit whatever you need. Name, email, photo and timezone are all changed in the same place.", "steps": ["Click your profile picture (top right on computer, top or bottom right on phone).", "Click 'Personal Settings'.", "Edit any field you need — name, email address, profile photo, timezone.", "Save."], "asked": ["How do I change my email address?", "How do I set up the profile?", "Where is your personal profile edit area?", "I signed up with the wrong email", "How do I change my profile details?"], "important": "", "variant": null, "status": "verified"}, {"id": "notifications_emails", "rank": 13, "title": "Too many emails and notifications", "audience": "both", "short": "The community can reach you five different ways — in-app, email, desktop, phone push and pop-up — and they are switched on and off separately. All five live under profile picture → Personal Settings → Notifications.", "steps": ["There are five separate ways the community can reach you: in the app (the bell), by email, on your desktop, as a push on your phone, and as a pop-up. Turning off one does not turn off the others — that is why it can feel like nothing worked.", "Set them all in one place: click your profile picture → 'Personal Settings' → 'Notifications', then choose what you want for each.", "Email is switched ON by default, and goes to the address you joined with.", "For emails you can also scroll to the bottom of any email and click 'Unsubscribe'. You may need to do this more than once — you can be on more than one list.", "On a phone you can additionally turn notifications off for the app in your phone's own settings.", "Notifications cannot be deleted. Clicking one clears its unread dot, but the list stays."], "asked": ["How do I unsubscribe from the emails?", "I don't want to receive so many emails", "How do I delete all previous notifications?", "Is there a way to expand the notifications on full screen?", "How do I stop the emails?", "Too many emails", "How do I turn off notifications?"], "important": "Unsubscribing from emails does NOT cancel your paid membership — those are separate. Members regularly confuse the two.", "variant": ["Scroll to the bottom of any Lesko email and click 'Unsubscribe'. You may need to do it more than once — you can be on more than one list.", "Unsubscribing from emails does NOT cancel a paid membership. If you're still being charged, that's a separate step.", "To stop the charges as well, cancel at https://leskosupport.com/account-management or email LeskoHelp@gmail.com."], "status": "verified"}, {"id": "pricing_and_plan", "rank": 14, "title": "What does it cost and what am I paying for?", "audience": "both", "short": "Check what plan you are actually on at https://leskosupport.com/account-management — there is also a short video showing how to check your membership.", "steps": ["Go to https://leskosupport.com/account-management to see your current plan and payment method.", "There is a walkthrough video for checking your membership linked from the Manage Your Account post in Community Updates.", "Billing runs through Recurly, which is the payment processor — a Recurly email about your subscription is expected, not a scam.", "If your plan on screen doesn't match what you're being charged, email LeskoHelp@gmail.com."], "asked": ["How much do you guys charge?", "I want to renew my subscription. How do I renew and what is a recurly account?", "I just joined with the 5 day trial — what happens when it ends?", "My profile says Free Member but I'm being charged", "What does the membership cost?", "How much is the membership?", "What am I paying for?"], "important": "", "variant": null, "status": "needs_check"}, {"id": "membership_status_renew", "rank": 15, "title": "Am I still a member? How do I renew or rejoin?", "audience": "both", "short": "Check your current status and plan at https://leskosupport.com/account-management before you pay for anything. Renewing an existing membership is not the same as signing up again — signing up again can create a second subscription and a second charge.", "steps": ["Go to https://leskosupport.com/account-management and check whether your membership is active and what plan you're on.", "There is also a short walkthrough video showing how to check your membership.", "Do NOT sign up again from a marketing email if you think you're still active — that is how members end up paying twice.", "If you are unsure, or the page and your bank statement disagree, email LeskoHelp@gmail.com before paying anything."], "asked": ["Did my membership expire?", "Am I no longer a member?", "How do I renew my membership without having to start a new one?", "Where do I go to re-up my membership?", "As a current member must I rejoin each year or does my membership continue until I cancel?", "I rejoined only to find out it's not expired — I don't think paying twice is the goal"], "important": "", "variant": null, "status": "needs_check"}, {"id": "which_site_to_use", "rank": 16, "title": "Which Lesko site am I supposed to log into?", "audience": "outside", "short": "There is more than one Lesko web address in circulation, and members regularly try to log in at the wrong one. The community itself is Lesko Help 2 at lesko-help-2.mn.co; account, billing and cancellation live at leskosupport.com.", "steps": ["The community — classes, Q&As, the AI tool, the Questions Channel — is at https://lesko-help-2.mn.co", "Your account, plan, payment method and cancellation are at https://leskosupport.com/account-management", "On a phone, the community is the Mighty Networks app — not a 'Lesko' app.", "If a link from an old email lands on a dead page or bounces you to a sign-up page, ignore it and go to the addresses above directly.", "Still can't get in? Email LeskoHelp@gmail.com with the email address you signed up with."], "asked": ["Where is the site to log in and manage lesko help membership? Not lesko 2, but the paid Lesko membership", "www.LeskoHelpMember.com is not working for me", "I am having trouble signing in to the members area at LeskoHelp.com", "I click the sign in link and I am redirected to a dead page", "have been asking how to login to lesko web sight, havent found it yet"], "important": "", "variant": null, "status": "needs_check"}, {"id": "switch_plan", "rank": 17, "title": "Can I switch from monthly to 6-month or annual?", "audience": "both", "short": "PLACEHOLDER — route to leskohelp@gmail.com until the switch path is confirmed.", "steps": [], "asked": ["I want to switch from monthly to annual", "Can I change to the six month plan?"], "important": "", "variant": null, "status": "needs_check"}], "library": {"Healthcare Assistance": [{"title": "Stress & Mental Health", "file": "Lesko_Help_HC02_Stress_Mental_Health_Quick_Guide", "resources": [{"n": "Feeling overwhelmed, anxious, or down? Support is available — from fre", "u": "www.findsupport.gov"}, {"n": "FindTreatment.gov", "u": "www.findtreatment.gov"}, {"n": "Community Mental Health Centers (SAMHSA)", "u": "www.samhsa.gov/find-help"}, {"n": "Free Support Groups", "u": "www.nami.org/help 1-800-950-6264"}, {"n": "Mental Health America — Find Support", "u": "www.mhanational.org/finding-help"}, {"n": "Free Self-Help Tools", "u": "mobile.va.gov/appstore/mental-health"}], "tip": "Be cautious of apps or sites promising to “cure”\nanxiety or depression with special sound\nfrequencies, supplements, or paid programs — these\naren’t proven. Stick to licensed providers and the\ntrusted nonprofits above.\n\nAsk your doctor or in", "watch": "★"}, {"title": "Medical Debt Relief", "file": "Lesko_Help_HC13_Medical_Debt_Relief_Quick_Guide", "resources": [{"n": "Already have medical de   /* ---------- signposting ----------
     The rule for every subject question: we do not answer it ourselves and we
     never hand out an outside phone number, email or website. We name the
     event to attend and the place inside the community that covers it.
     Finding the actual grants is the AI Grant Researcher's job, not ours. */

  function evAll(name) {
    return D.events.filter(function (e) { return e.name === name; });
  }
  function evTable(names) {
    var rows = [];
    names.forEach(function (n) {
      evAll(n).forEach(function (e) {
        rows.push(['<a href="' + esc(e.url) + '" target="_blank" rel="noopener"><b>' + esc(e.name) + "</b></a>",
                   esc(e.day),
                   '<b style="color:var(--red)">' + esc(e.time) + "</b>",
                   esc(e.about)]);
      });
    });
    return { head: ["Class", "Day", "Time (ET)", "What it is for"], rows: rows };
  }
  /* ---------- lessons and quick guides ----------
     A subject answer names three things, never one: the classes to attend, the
     lessons to read and the quick guides to download. Giving only the classes
     leaves most of the community on the shelf. */

  /* Whole words only. A loose prefix match put "Help for Caregivers" under a
     question about dental CARE, which is exactly the kind of near-miss that
     makes an answer look careless. A short suffix (dental/dentals) still counts. */
  function stem(w) { return w.length > 3 ? w.replace(/(ies|es|s)$/, "") : w; }
  function wordHit(hw, w) {
    if (hw === w) return true;
    var a = stem(hw), b = stem(w);
    if (a === b) return true;
    /* A loose prefix is only safe on a long word. Allowing it on short ones
       matched "car" against "care", which sent someone asking about their car
       to the dental and pet guides. */
    var lo = a.length < b.length ? a : b, hi = a.length < b.length ? b : a;
    return lo.length >= 5 && hi.length - lo.length <= 2 && hi.indexOf(lo) === 0;
  }
  function score(hay, qw) {
    var hws = norm(hay).trim().split(" "), n = 0;
    qw.forEach(function (w) { if (anyHit(hws, w)) n += 2; });
    return n;
  }
  /* Scored hits first; if nothing scores, hand back the top of the list anyway
     so a broad question ("start a business") still gets real material. */
  function pick(items, cap, strict, topTier) {
    var scored = items.filter(function (x) { return x.s > 0; })
                      .sort(function (a, b) { return b.s - a.s; });
    /* topTier: keep ONLY the best-matching resources. Someone asking about
       dental care is not asking about their cat or a hearing aid, and a weaker
       match sitting underneath the right answer makes the whole reply look
       careless. One resource is a fine answer. */
    if (topTier && scored.length) {
      var best = scored[0].s;
      scored = scored.filter(function (x) { return x.s === best; });
    }
    /* strict: a narrow subject (AI, nonprofit) must never pad itself out with
       whatever else happens to sit in the same space. */
    var list = scored.length || strict ? scored : items;
    return { shown: list.slice(0, cap), total: list.length, matched: scored.length > 0 };
  }

      });
    });

  }

        /* Score the guide's own title only. Folding the category name in made
           every guide in a category tie, so "car" pulled up Government

    catBox.innerHTML = CATS.member.map(function (c, i) {
      return '<div class="cat" open-state="' + (i === 0 ? "1" : "0") + '">' +
        '<button type="button" aria-expanded="' + (i === 0) + '">' +
        '<span class="dot" style="background:' + c.colour + '"></span>' + esc(c.name) +
        '<span class="arrow">&#9656;</span></button><ul>' +
        c.qs.map(function (q) { return "<li><button type='button'>" + esc(q) + "</button></li>"; }).join("") +
        "</ul></div>";
    }).join("");
    [].forEach.call(catBox.querySelectorAll(".cat"), function (cat) {
      var head = cat.querySelector("button");
      head.addEventListener("click", function () {
        var open = cat.getAttribute("open-state") === "1";
        cat.setAttribute("open-state", open ? "0" : "1");
        head.setAttribute("aria-expanded", String(!open));
      });
      [].forEach.call(cat.querySelectorAll("ul button"), function (b) {
        b.addEventListener("click", function () { ask(b.textContent); });
      });
    });
  }
  function ask(q) {
    q = String(q || "").trim();
    if (!q) return;
    lastQ = q;
    if (document.body.classList.contains("nav-open")) setNav(false);
    bubble("me", "<p>" + esc(q) + "</p>");
    input.value = "";
    var t = typing();
    setTimeout(function () {
      t.parentNode && t.parentNode.removeChild(t);
      answer(q);
    }, 1200 + Math.min(q.length * 12, 800));   /* 1.2s floor, 2s cap - a believable pause */
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); ask(input.value); });
  bubble("bot", card({
    title: "Hi \u2014 what do you need?",
    lead: "Pick a category on the right, or type your question below. I will point you to the exact class, guide or page \u2014 and show you what is in it.",
    sections: [{ bullets: [
      "<b>Getting started</b> \u2014 the roadmap, your first steps",
      "<b>Your call sheet</b> \u2014 make one, find yours, fix a problem",
      "<b>Classes &amp; live help</b> \u2014 what is on, replays, talking to a person",
      "<b>Help by topic</b> \u2014 rent, cars, medical bills, business and more" ] }],
    related: ["Where do I start?", "How do I create my call sheet?", "What classes are on this week?"]
  }));

  /* menu drawer (narrow frames) */
  var burger = document.getElementById("burger");
  var scrim  = document.getElementById("scrim");
  function setNav(open) {
    document.body.classList.toggle("nav-open", open);
    if (burger) burger.setAttribute("aria-expanded", String(open));
  }
  if (burger) burger.addEventListener("click", function () {
    setNav(!document.body.classList.contains("nav-open"));
  });
  if (scrim) scrim.addEventListener("click", function () { setNav(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") setNav(false);
  });

  renderCats();
})();

</script>
