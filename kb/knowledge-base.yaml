- id: getting_started
  rank: 6
  title: I just joined — what do I do first?
  status: verified
  asked_as:
    - "May I please have help getting started"
    - "I'm new to the platform and I'm a bit overwhelmed"
    - "I am 88 and need assistance getting started"
    - "I need a tutorial how to use this site"
  short_answer: >
    Start with Explore the Roadmap and its checklist, join a Welcome Tour (runs daily), then tell us
    in the Questions Channel what you actually need help with so we can point you at the right resources.
  steps:
    - "Work through Explore the Roadmap and complete the setup checklist — even long-time members are asked to do this."
    - "Join the WELCOME TOUR — it runs every day and walks you around the community."
    - "Post in the Questions Channel saying what kind of help you're looking for. The team replies under your post with specific recommendations."
    - "Next step after that is building your Call Sheet — via a Call Sheet Class, the AI Researcher, or the Questions Channel."
    - "Then move into the Call and Application Classes, and keep using Q&As, Group Coaching and Matthew's Live sessions."
  sources: [S13, S19]
  media_needed: "Screen recording: the roadmap checklist and joining the Welcome Tour."

