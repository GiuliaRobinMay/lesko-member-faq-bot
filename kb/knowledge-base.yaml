- id: notifications_emails
  rank: 13
  title: Too many emails and notifications
  status: verified
  asked_as:
    - "How do I unsubscribe from the emails?"
    - "I don't want to receive so many emails"
    - "How do I delete all previous notifications?"
    - "Is there a way to expand the notifications on full screen?"
  short_answer: >
    Emails and in-app notifications are controlled separately. Emails: unsubscribe at the bottom of
    the email. Notifications: profile picture → Personal Settings → Notifications.
  steps:
    - "For emails: scroll to the bottom of any email you don't want and click 'Unsubscribe'. You may need to do this more than once — you can be signed up through more than one list."
    - "For in-app notifications: click your profile picture → 'Personal Settings' → 'Notifications', then choose the levels you want."
    - "On a phone you can also turn notifications off for the app in your phone's own settings."
    - "Notifications cannot be deleted. Clicking one clears its unread dot, but the list stays."
  important: "Unsubscribing from emails does NOT cancel your paid membership — those are separate. Members regularly confuse the two."
  sources: [S9, S10, S11]
  media_needed: "Screen recording: Personal Settings → Notifications, and the unsubscribe link in an email."

