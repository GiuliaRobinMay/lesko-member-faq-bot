- id: cancel_subscription
  rank: 1
  title: How do I cancel my subscription or membership?
  status: verified
  asked_as:
    - "How do I cancel my subscription?"
    - "Where is the link to cancel before the 5-day window?"
    - "I'm changing banks, how do I cancel my paid membership?"
    - "Cancel membership"
    - "It is next to impossible to cancel this subscription"
  short_answer: >
    There are two ways: cancel it yourself on the Lesko Support site, or email Customer Service
    and they will do it for you and confirm by reply.
  steps:
    - "Self-serve: go to https://leskosupport.com/account-management and scroll to the bottom of the page — the cancellation instructions are there."
    - "Or email LeskoHelp@gmail.com and ask to cancel. Mary Pacey in Customer Service handles cancellations and will reply to confirm it is done."
    - "Before you cancel, download anything shared with you — Call Sheets, reports, spreadsheets. That material stays yours whether you stay or go."
    - "On the $1 / 5-day trial: cancel before the 5 days are up to avoid the next charge."
  escalate_when: "Member says they already emailed and got no reply, or is still being charged after cancelling → hand to Customer Service with the member's email address and dates."
  sources: [S1, S2, S3]
  media_needed: "Screen recording: leskosupport.com → Account Management → scroll to cancellation section."

- id: refunds_billing
  rank: 2
  title: Refunds, unexpected charges and updating my card
  status: verified
  asked_as:
    - "How do I get a refund?"
    - "My account auto renewed. How can I request a refund?"
    - "I'm being charged a monthly subscription yet the site says my membership is free"
    - "How do I update my payment card on file?"
    - "What is the $60 charge?"
  short_answer: >
    All billing — refunds, duplicate or unexpected charges, and payment method changes — is handled
    by Mary Pacey in Customer Service at LeskoHelp@gmail.com. Account details can also be managed
    on the Lesko Support site.
  steps:
    - "Email LeskoHelp@gmail.com with your account email and the charge date and amount."
    - "For an auto-renewal you did not expect, ask to cancel the membership AND refund the auto-renewal in the same message."
    - "To update a card or check what plan you are on, use https://leskosupport.com/account-management."
    - "If your profile says 'Free Member' but you are still being charged, say so explicitly — that mismatch needs Customer Service to look at the billing record."
  escalate_when: "Always route to Customer Service — the bot should never promise a refund, only explain how to request one."
  sources: [S1, S4, S5, S6]
  media_needed: "Screen recording: where to find your plan and payment method on the account management page."
  open_question: "Is there a stated refund window or policy the bot may quote? Not published anywhere in-community."

- id: calls_zoom_replays
  rank: 3
  title: Live calls — what's on, how to join, and where the replays are
  status: verified
  asked_as:
    - "How do I join zoom?"
    - "Is there a zoom meeting today?"
    - "Where can I find the meeting ID or the invitation link?"
    - "Did I miss the workshop? How can I replay a video?"
    - "Zoom says we are waiting on the host"
  short_answer: >
    There is a live session almost every day. Open the event in the community, click the pink
    "Zoom Meeting" link, and if you don't have Zoom installed click "Join Zoom from Browser".
    Replays go into the Class Replays space.
  steps:
    - "Open the event post in the community, then click 'Zoom Meeting' written in pink."
    - "No Zoom account? Click 'Join Zoom from Browser' instead — you do not need to install anything."
    - "If you can't be heard or seen: hover over the bottom of the Zoom window, click 'Join Audio', then the video button, and allow Zoom to use your microphone and camera."
    - "'Waiting for the host' means the host has not opened the room yet — stay in the waiting room, it will start."
    - "Missed it? Find the recording in Class Replays: https://lesko-help-2.mn.co/spaces/24487516"
    - "Struggling during a session — type the problem into the Zoom chat, a coach will help you there."
  weekly_schedule:
    - "Daily — WELCOME TOUR (Daily Welcome Tour space)"
    - "Monday — Mid Mondays Member Q&A; Monday's OPEN OFFICE with Tony (navigating Lesko Help + grant-search basics)"
    - "Tuesday — MATTHEW MEETUP, live with Matthew"
    - "Wednesday — Pay My Debt & Bills; AI User Skills with Roger; Business Growth with Amber"
    - "Thursday — Drop-In Clinic 10:00–18:00 ET, no appointment needed; Thursdays Member Q&A with Tony"
    - "Friday — AI Workshop; Grant Application Workshop with Megan; Starting & Re-Starting a Business"
    - "Saturday — Saturdays Member Q&A with Tony; Business Series Saturdays"
    - "Sunday — Sundays Member Q&A with Tony; Start a Nonprofit with Megan"
  sources: [S14, S18, S21]
  media_needed: "Screen recording: opening an event → clicking the pink Zoom link → Join from Browser → turning on audio/video."
  open_question: "Schedule captured 2026-08-21. Should the bot read the live event list dynamically instead of using a fixed schedule? Recommended — times shift."

- id: call_sheet_and_reports
  rank: 4
  title: Call Sheets, Personal Reports and books I paid for
  status: needs_check
  asked_as:
    - "How and who do I ask to start my personal report?"
    - "Can you please update my comprehensive personal report?"
    - "Where is my report?"
    - "I bought the E Book for Texas and I do not see an email with it"
    - "I paid an additional fee to receive a book. When will I receive it?"
  short_answer: >
    The current deliverable is the Personalized Call Sheet, and there are three ways to get one:
    a Call Sheet Class, the Lesko AI Researcher, or by asking in the Questions Channel.
  steps:
    - "Fastest: run the AI Grant Researcher yourself — pick your topic, enter your city and state or ZIP, and it builds your list."
    - "Or attend a Call Sheet Class and the host will build one with you live."
    - "Or post what you need in the Questions Channel and the team will reply with a Call Sheet under your post."
    - "Delivered Call Sheets are posted for you in Personalized Class Answers — check your notification bell."
    - "Paid book or e-book that hasn't arrived: that's a fulfilment question — email LeskoHelp@gmail.com."
  legacy_note: >
    The older "Lesko Personal Report" was built by hand by Misty Fowlds and Sabrina Giesler from a list
    of 3–10 goals posted in the Partnership & Accountability space. Members still ask for it by name.
  sources: [S19, S20, S15]
  media_needed: "Screen recording: requesting a Call Sheet in the Questions Channel, and where delivered Call Sheets appear."
  open_question: >
    CONFIRMED BY YOU: the Mini-500 is no longer given out. The bot needs one agreed sentence for
    'the Mini-500 / state report is no longer offered — here is what replaces it'. Also: is the
    hand-built Personal Report still offered at all, or is the Call Sheet now the only route?

