- id: ai_grant_researcher
  rank: 8
  title: How do I use the AI Grant Researcher?
  status: verified
  asked_as:
    - "Does the members AI tool work, I keep getting page not available"
    - "Your AI doesn't work, I've been trying for a month"
    - "Where do I find the AI tool?"
    - "Where did my AI research results go?"
  short_answer: >
    Pick your topic, enter your city and state or ZIP, and hit Run Research Tool. Results build up
    over several minutes, then you can open each one for contact details or export the whole list.
  steps:
    - "Open the AI Grant Researcher: https://lesko-help-2.mn.co/spaces/24461105"
    - "Select your Topic, then enter your ZIP code or your city and state."
    - "Hit 'Run Research Tool'. Results arrive one or two at a time and a full search can take 10–15 minutes depending on your device and connection."
    - "Click '2: Results' to see what it found in your area."
    - "Hit 'See Details' on any organisation for phone numbers, email addresses, eligibility, funding amounts, and a ready-made outreach message."
    - "Click '3: Export' to download the list to your device as Excel or PDF."
    - "Click 'Clear Report' to run a fresh search for another topic or area."
    - "Want to be taught it live? The AI Workshop runs Fridays, and AI User Skills with Roger runs Wednesdays."
  sources: [S15, S16, S21]
  media_needed: "Screen recording: full run — topic → location → Run → Results → See Details → Export."
  open_question: "Two URLs are in circulation (spaces/24461105 and spaces/23670974/page). Which is canonical?"

- id: login_password
  rank: 9
  title: I can't log in or I forgot my password
  status: verified
  asked_as:
    - "I can't get in. My email and password not working"
    - "I didn't receive email to reset my password"
    - "Trying to change password but do not know the current password"
    - "It says no account found with that email"
  short_answer: >
    Use "Forgot password?" on the login page — it resets by email, so you don't need your old password.
    If that doesn't arrive, the platform's own support team can fix it directly.
  steps:
    - "On the login page click 'Forgot password?' and follow the email link."
    - "Check spam/junk if the reset email doesn't appear."
    - "Still stuck: click the 'Need Help?' button at the bottom of any page in the community."
    - "Or email help@mightynetworks.com — Lesko Help runs on Mighty Networks and their team can sort out account access directly."
    - "'No account found' usually means a different email than the one you joined with — try any other addresses you use."
  sources: [S7]
  media_needed: "Screen recording: the Forgot password flow and where the Need Help? button is."

- id: app_and_devices
  rank: 10
  title: Which app is it and how do I install it?
  status: verified
  asked_as:
    - "How do I download the app?"
    - "What is the name of the app that I need to download"
    - "I can't find the Lesko app on Google Play"
    - "Can I have the app on my laptop?"
  short_answer: >
    The app is Mighty Networks, not a "Lesko" app — which is why searching the store for Lesko finds
    nothing. Get it via the QR code in your Personal Settings.
  steps:
    - "Click your profile picture in the top right, then 'Personal Settings'."
    - "Scroll down and click 'Download the app' — a QR code appears."
    - "Scan the QR code, then use the button for Google Play or the App Store depending on your device."
    - "Log in on your phone with the same email address and password you use on the computer."
    - "Searching the store for 'Lesko' will not find it — the app is called Mighty Networks."
  sources: [S8]
  media_needed: "Screen recording: Personal Settings → Download the app → QR code → store → first login on phone."

