- id: membership_status_renew
  audience: both
  rank: 15
  title: Am I still a member? How do I renew or rejoin?
  status: needs_check
  asked_as:
  - Did my membership expire?
  - Am I no longer a member?
  - How do I renew my membership without having to start a new one?
  - Where do I go to re-up my membership?
  - As a current member must I rejoin each year or does my membership continue until I cancel?
  - I rejoined only to find out it's not expired — I don't think paying twice is the goal
  short_answer: 'Check your current status and plan at https://leskosupport.com/account-management before
    you pay for anything. Renewing an existing membership is not the same as signing up again — signing
    up again can create a second subscription and a second charge.

    '
  steps:
  - Go to https://leskosupport.com/account-management and check whether your membership is active and
    what plan you're on.
  - There is also a short walkthrough video showing how to check your membership.
  - Do NOT sign up again from a marketing email if you think you're still active — that is how members
    end up paying twice.
  - If you are unsure, or the page and your bank statement disagree, email LeskoHelp@gmail.com before
    paying anything.
  escalate_when: Member believes they have two active subscriptions, or has been charged after their membership
    supposedly lapsed → Customer Service.
  sources:
  - S6
  media_needed: 'Screen recording: checking membership status and plan, and what ''active'' looks like.'
  open_question: 'Two things I could not answer from inside the community: (a) does a membership auto-renew
    until cancelled, or does it lapse and need renewing? (b) what is the correct route to reactivate a
    lapsed membership without creating a duplicate subscription?

    '
